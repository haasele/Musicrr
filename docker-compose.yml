services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: musicrr-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_HTTPS_PORT:-9443}:9443"
    environment:
      VITE_API_ORIGIN: ${VITE_API_ORIGIN:-}
      VITE_TLS: "1"
      TLS_CERT_PATH: /run/certs/origin-cert.pem
      TLS_KEY_PATH: /run/certs/origin-key.pem
    volumes:
      - /etc/ssl/cloudflare/musicrr:/run/certs:ro
    command: ["bun", "run", "--cwd", "apps/web", "dev", "--host", "0.0.0.0", "--port", "9443"]

  postgres:
    image: postgres:16-alpine
    container_name: musicrr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musicrr}
      POSTGRES_USER: ${POSTGRES_USER:-musicrr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musicrr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Wichtig: DB bleibt nur erhalten, wenn dieses Verzeichnis auf dem Host **nicht** gelöscht wird.
    # Deploy: denselben Projektordner wiederverwenden oder dieses Volume sichern. `docker compose down` ohne -v
    # löscht **keine** Bind-Mounts; `rm -rf .data` leert die DB.
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musicrr} -d ${POSTGRES_DB:-musicrr}"]
      interval: 5s
      timeout: 5s
      retries: 20

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: musicrr-dragonfly
    restart: unless-stopped
    command: ["--dir=/data"]
    ports:
      - "${DRAGONFLY_PORT:-6379}:6379"
    volumes:
      - ./.data/dragonfly:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: musicrr-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-musicrr}:${POSTGRES_PASSWORD:-musicrr}@postgres:5432/${POSTGRES_DB:-musicrr}
      DRAGONFLY_URL: redis://dragonfly:6379
      UPLOAD_DIR: /app/apps/api/uploads
      VISUAL_PRESETS_DIR: /app/visual
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      # Browsers send Origin: <web UI URL> — e.g. http://YOUR_PUBLIC_IP:3000, not the API port 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://musicrr-api:3001}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now-please}
      ADMIN_NAME: ${ADMIN_NAME:-Musicrr Admin}
    ports:
      - "3001:3001"
    # Medien-Uploads: gleiches Prinzip wie postgres — .data auf dem Host erhalten
    volumes:
      - ./.data/uploads:/app/apps/api/uploads
